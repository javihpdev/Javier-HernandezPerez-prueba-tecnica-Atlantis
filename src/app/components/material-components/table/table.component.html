<div class="material-container">
  @if(loading){
    <div class="d-flex justify-content-center mb-5">
      <div class="spinner-border"
           role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </div>
  }
  @if (!loading && data.length == 0){
    <p>{{'No hay resultados en la busqueda.'}}</p>
  }
  <div class="material-table-container" [hidden]="loading || data.length == 0">
    <table mat-table [dataSource]="data"
           class="example-table"
           aria-describedby="Example Table"
           matSort
           [matSortActive]="paginator.orderField"
           matSortDisableClear
           [matSortDirection]="paginator.orderType">

      @for (column of columns; track $index){
        <ng-container [matColumnDef]="column.sortName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
            {{column.title}}
          </th>
          <td mat-cell *matCellDef="let row" [innerHTML]="getRow(row, column)"></td>
        </ng-container>
      }

      @if (actions){
        <ng-container [matColumnDef]="'actions'">
          <th mat-header-cell *matHeaderCellDef>
            Opciones
          </th>
          <td mat-cell *matCellDef="let row">
            <div class="d-flex">
              @if(actions.includes(ActionEnum.EDIT)){
                <button (click)="actionEventClick.emit({action: ActionEnum.EDIT, row: row})" type="button"
                        title="{{'Editar' | translate}}"
                        class="btn btn-outline-primary d-flex align-items-center me-1" >
                  <mat-icon>edit</mat-icon>
                </button>
              }
              @if(actions.includes(ActionEnum.REMOVE) && isAllowed()){
                <button (click)="actionEventClick.emit({action: ActionEnum.REMOVE, row: row})" type="button"
                         title="{{'Eliminar' | translate}}"
                         class="btn btn-outline-danger d-flex align-items-center me-1">
                  <mat-icon>delete</mat-icon>
                </button>
              }
            </div>
          </td>
        </ng-container>
      }
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>-
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator
      [showFirstLastButtons]="true"
      [pageSizeOptions]="[5, 10, 15, 20]"
      [length]="paginator.pageTotal * paginator.pageSize"
      [pageSize]="paginator.pageSize"
      aria-label="Select page of GitHub search results"></mat-paginator>
  </div>
</div>
