<div class="register-container">
  <div class="register-card">
    
    @switch (currentStep()) {
      @case (1) {
        <app-personal-data (next)="next()" />
      }
      @case (2) {
        <app-contact-data (next)="next()" (previous)="previous()" />
      }
      @case (3) {
        <app-legal-bases (complete)="complete()" (previous)="previous()" />
      }
    }
  </div>
</div>
